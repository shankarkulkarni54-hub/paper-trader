name: Daily Swing Paper Trading Bot

on:
  schedule:
    # 10:08 UTC corresponds to 15:38 (3:38 PM) IST, Monday to Friday
    - cron: '8 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Swing Trading Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py

      - name: Commit and Push Updated Database & Logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add paper_trading.db daily_trades.log nifty200.csv
          git diff --staged --quiet || (git commit -m "chore: auto-update paper trading database [skip ci]" && git push)
